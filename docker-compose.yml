services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_password}
      POSTGRES_DB: ${POSTGRES_DB:-erp_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, automatically, the first time this volume is
      # initialized: creates the restricted "erp_app" runtime role (see
      # docs/M1_DATABASE_DESIGN.md "Audit-log & ledger write protection").
      # Has no effect against an existing volume — see the README for how
      # to bootstrap an already-running database.
      - ./backend/scripts/bootstrap_db_roles.sql:/docker-entrypoint-initdb.d/01_bootstrap_db_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env so the backend reaches the `db` service by name
      # instead of localhost when running under Compose.
      #
      # DATABASE_URL (app runtime) uses the restricted "erp_app" role
      # bootstrapped by db's init script above — NOT the same role as
      # MIGRATIONS_DATABASE_URL. The placeholder password here matches the
      # bootstrap script's placeholder exactly; both MUST be rotated
      # together (see backend/scripts/bootstrap_db_roles.sql) before any
      # non-local deployment.
      DATABASE_URL: postgresql+psycopg://erp_app:CHANGE_ME_IN_PRODUCTION@db:5432/${POSTGRES_DB:-erp_dev}
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_password}@db:5432/${POSTGRES_DB:-erp_dev}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
