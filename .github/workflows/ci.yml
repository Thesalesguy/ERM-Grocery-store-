name: CI

# Runs the same validation gates on every push/PR that have been run
# manually after each milestone (see docs/M2_AUTH_AND_POS.md and
# docs/M2_HARDENING_AUDIT.md §16/26): backend tests against real
# PostgreSQL (never SQLite — money/transaction behavior must be verified
# against the real database), lint/format/type-check, a dependency
# vulnerability scan, and the equivalent frontend gates. Nothing here
# changes application behavior; it only automates checks that were
# previously run by hand.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: erp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user -d erp_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://erp_app:erp_app_password@localhost:5432/erp_dev
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://erp_user:erp_password@localhost:5432/erp_dev
      TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://erp_user:erp_password@localhost:5432/erp_test
      SECRET_KEY: ci-only-not-a-real-secret-but-at-least-32-bytes-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Bootstrap erp_app role and erp_test database
        # Mirrors README "Database Setup": erp_user (the Postgres service
        # container's own superuser here) creates the restricted erp_app
        # runtime role, then a second database for the destructive
        # migration-cycle test (tests/test_migrations.py) so it never
        # touches erp_dev, which the rest of the suite uses.
        env:
          PGPASSWORD: erp_password
        run: |
          psql -h localhost -U erp_user -d erp_dev -f backend/scripts/bootstrap_db_roles.sql
          psql -h localhost -U erp_user -d erp_dev -c "ALTER ROLE erp_app WITH PASSWORD 'erp_app_password';"
          psql -h localhost -U erp_user -d postgres -c "CREATE DATABASE erp_test OWNER erp_user;"

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Format check (black)
        working-directory: backend
        run: black --check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Tests (pytest, against real PostgreSQL)
        working-directory: backend
        run: pytest -q

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        # Informational for now, not a merge blocker: a new advisory in a
        # transitive dependency shouldn't turn an unrelated PR red before
        # anyone has reviewed it. Findings are still visible in the log.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  deploy-infra:
    # M16 Phase 0 item 9: deploy/tests/ (the M13 production-topology
    # suite -- real nginx + real uvicorn, no mocks) had never run in CI,
    # so a proxy/TLS/rate-limit regression could only be caught by
    # someone remembering to run it by hand. Wires in the subset that
    # only needs nginx + this job's own Postgres service
    # (conftest.py's `production_stack` fixture): proxy/TLS, rate
    # limiting, connectivity failure, observability correlation, and
    # the performance baseline -- 22 of the suite's 73 tests.
    #
    # Deliberately NOT wired in here: test_monitoring.py (needs a full
    # Prometheus/Alertmanager/node_exporter/postgres_exporter stack),
    # test_backup_offbox.py and the rclone/gpg-dependent parts of
    # test_adversarial_security_audit.py and
    # test_failure_injection_disaster_recovery.py (need rclone + a
    # native `postgres` OS user via `sudo -u postgres`, which this
    # job's Docker-container Postgres service does not provide), and
    # test_deploy_procedure.py (assumes a backend/.venv/ this repo's CI
    # does not create). Standing these up safely is a separate,
    # larger infrastructure task -- see docs/M16_HARDENING_AUDIT.md
    # "CI coverage for deploy/tests/" for the full reasoning, so this
    # gap is documented rather than silently left unaddressed.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: erp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user -d erp_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://erp_app:erp_app_password@localhost:5432/erp_dev
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://erp_user:erp_password@localhost:5432/erp_dev
      SECRET_KEY: ci-only-not-a-real-secret-but-at-least-32-bytes-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Bootstrap erp_app role
        env:
          PGPASSWORD: erp_password
        run: |
          psql -h localhost -U erp_user -d erp_dev -f backend/scripts/bootstrap_db_roles.sql
          psql -h localhost -U erp_user -d erp_dev -c "ALTER ROLE erp_app WITH PASSWORD 'erp_app_password';"

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Tests (pytest, real nginx + real uvicorn production topology)
        run: |
          pytest -v \
            deploy/tests/test_proxy_tls.py \
            deploy/tests/test_rate_limiting.py \
            deploy/tests/test_connectivity_failure.py \
            deploy/tests/test_observability_correlation.py \
            deploy/tests/test_performance_baseline.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Format check (prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Type check (tsc)
        working-directory: frontend
        run: npx tsc -b

      - name: Tests (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Dependency vulnerability scan (npm audit)
        working-directory: frontend
        continue-on-error: true
        run: npm audit
