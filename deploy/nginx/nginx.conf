# M13 production nginx config — top-level directives only.
# Site-specific config (TLS, proxy, rate limiting) lives in conf.d/erp.conf.
#
# IPv4 only: this project's own CI/dev sandbox has no IPv6 in its network
# namespace (discovered the hard way — the stock Debian/Ubuntu nginx
# package's default config listens on `[::]:80` and fails to start
# outright in such an environment). A real VPS deployment nearly always
# does have IPv6; nothing here prevents adding a `listen [::]:443 ssl;`
# line later if the target host has it. Kept IPv4-only for now because
# that's what was actually tested.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # M12's own JSON access-log convention (app.core.logging) is mirrored
    # here in spirit: structured enough to grep, never includes headers
    # or bodies, so no credential/token can appear in an nginx log line
    # (M13 Phase 13 — see deploy/tests/test_observability.py).
    log_format erp_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_method":"$request_method","request_uri":"$request_uri",'
        '"status":$status,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$sent_http_x_request_id"}';

    access_log /var/log/nginx/access.log erp_json;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # M12 Phase 7's application-layer request-size limit
    # (settings.MAX_REQUEST_BODY_BYTES, 2MB) gets its proxy-layer
    # backstop here — see conf.d/erp.conf. Setting it at this http{}
    # level too means even a misconfigured server{} block still has a
    # sane default.
    client_max_body_size 2m;

    # M13 Phase 4: rate-limiting zones, shared across nginx worker
    # processes (unlike the M12 in-process Python limiter, this is
    # effective even with multiple backend upstream workers, because it
    # is nginx itself — not any one backend process — enforcing it).
    limit_req_zone $binary_remote_addr zone=erp_login:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=erp_refresh:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=erp_admin:10m   rate=20r/m;
    limit_req_zone $binary_remote_addr zone=erp_reports:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=erp_general:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=erp_conn:10m;

    # nginx's own default rejection status for a `limit_req` zone is
    # 503 (Service Unavailable) -- found by this phase's own test
    # actually running against a real limiter and getting 503s where
    # 429 was expected, not assumed from nginx's documentation alone.
    # 429 (Too Many Requests) is the correct, more specific status and
    # matches the existing app-level limiter's own convention (M2/M12,
    # app.core.rate_limit.RateLimitedError), so every zone in this file
    # uses it instead of nginx's default.
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
