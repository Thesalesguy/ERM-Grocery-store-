# M13 Phase 3/4: the Docker Compose edition of deploy/nginx/conf.d/
# erp.conf — identical in every respect except the backend upstream
# address, since Compose service discovery uses the service name
# ("backend"), not loopback. Kept as a separate file rather than an
# envsubst template so the file actually tested by deploy/tests/
# (erp.conf, against a real running nginx+uvicorn in this sandbox) is
# never itself templated/conditional — if you change one file's
# routing/rate-limiting/header logic, change the other the same way.
#
# Paths below match this repo's real deployment layout:
#   /etc/nginx/tls/fullchain.pem, /etc/nginx/tls/privkey.pem
#     — a self-signed pair for this milestone's own tests
#       (deploy/tls/generate_self_signed_cert.sh), OR certbot's own
#       /etc/letsencrypt/live/<domain>/{fullchain,privkey}.pem in a real
#       deployment (see docs/M13_DESIGN.md Section 4.1) — swap the
#       `ssl_certificate*` paths below to point there instead; nothing
#       else in this file changes.
#   /srv/erp/frontend-dist — the `npm run build` output
#     (frontend/dist in this repo), copied/mounted here at deploy time.
#
# Backend upstream: backend:8000 — the Compose-internal network only.
# This is the actual network-segmentation control (docs/M13_DESIGN.md
# Section 3): docker-compose.prod.yml publishes no port for the backend
# service at all, so nothing outside the Compose network can reach it
# regardless of application-layer behavior, because there is no route
# to it.

server {
    listen 80;
    server_name _;

    # ACME HTTP-01 challenge path (docs/M13_DESIGN.md Section 4.1) —
    # the only thing this port ever does besides redirecting.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy-layer secure headers. `add_header` does not overwrite a
    # same-named header the upstream already set — it appends another
    # copy, producing a comma-joined duplicate like
    # "nosniff, nosniff" (found by deploy/tests/test_proxy_tls.py: a
    # real test failure, not a hypothetical). `proxy_hide_header`
    # strips the backend's own copies of the three headers
    # app.core.http_hardening.add_security_headers (M12 Phase 7) also
    # sets, so nginx is the single, authoritative source for all four
    # at the edge — this is still defense-in-depth (the backend keeps
    # setting them for any request path that bypasses nginx, e.g. a
    # direct-to-backend health check from the host itself), just not
    # duplicated on the response a real client sees.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;
    limit_conn erp_conn 20;

    # A per-request correlation ID that survives the proxy hop (M12
    # Phase 11 / M13 Phase 13): if the client already sent one, nginx's
    # own $http_x_request_id carries it through unmodified via
    # proxy_set_header below; the backend's own correlation middleware
    # generates one when absent, and nginx logs whatever the BACKEND
    # RESPONSE carried in $sent_http_x_request_id (see nginx.conf's
    # erp_json log format) — not a separately-generated proxy-side ID,
    # so one correlation ID covers the whole request end to end.

    location /health {
        limit_req zone=erp_general burst=20 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /api/v1/auth/login {
        limit_req zone=erp_login burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /api/v1/auth/refresh {
        limit_req zone=erp_refresh burst=10 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Regex (`~`) locations are tried in the order they appear in this
    # file — the FIRST match wins, not the most specific — so the most
    # specific routes (admin mutation, reports) are declared before the
    # general /api/v1/ prefix location further down. A prefix location
    # is only used when no regex location matches at all.
    location ~ ^/api/v1/auth/users/[0-9]+/deactivate$ {
        # The one administrative mutation M12 Phase 10 built (user
        # deactivation) gets the tighter erp_admin zone.
        limit_req zone=erp_admin burst=10 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location ~ ^/api/v1/reports/ {
        limit_req zone=erp_reports burst=10 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/v1/ {
        limit_req zone=erp_general burst=40 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Static frontend (the `vite build` output) with SPA fallback — no
    # Node process runs in production, unlike the dev Compose stack.
    root /srv/erp/frontend-dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
