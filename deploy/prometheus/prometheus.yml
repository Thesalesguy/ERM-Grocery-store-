# M13 Phase 6: minimal Prometheus config. No Grafana, no remote-write,
# no long-term-storage backend — the built-in TSDB (default 15-day
# retention) and Prometheus's own expression browser/Alertmanager's own
# UI are the whole stack, deliberately, to stay well short of "an
# unnecessarily large observability platform" for a single-VPS
# deployment at this scale.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "erp_exporter"
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["127.0.0.1:9187"]
